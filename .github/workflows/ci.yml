name: ci
on:
  push:
  pull_request:
jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run check:links
      - run: npm run check:cdn-url     # docs must not point at the undeployed cdn.glemo.io
      - run: npm run check:copy         # Regla #3: copy must not promise what the product cannot do
      - run: npm run check:sdk-copy     # Regla #4: dev copy must match the real SDK surface
      - run: npm run check:receipt      # the receipt snippet needs jose and nothing of ours
      - run: npm run check:quickstart   # doc snippet must use the real SDK surface (live run is local)
      - run: npx tsc --noEmit
      # The build itself. Eleven checks ran here and none of them was this one, so
      # "landing: build verde" had never been demonstrated by anything: a broken page,
      # a bad MDX frontmatter or a missing import reached deploy with CI green. It goes
      # after tsc because a type error is the cheaper failure and should be reported
      # first.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high   # SCA: high/critical vulns fail
      # React2Shell-class: patched Next floor. CI breaks if it drops below.
      - run: |
          node -e '
            const v = require("./package.json").dependencies.next.replace(/^[\^~]/, "");
            const [a, b, c] = v.split(".").map(Number);
            const n = a * 1e6 + b * 1e3 + c;
            if (n < 15_005_020) { console.error(`next ${v} < floor 15.5.20`); process.exit(1); }
          '
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
